<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - ExpiryWatch</title>
    <link rel="stylesheet" th:href="@{/theme.css}">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1rem;">
            <img th:src="@{/logo.png}" alt="ExpiryWatch Logo" style="height: 60px; width: auto;">
        </div>
        <h1 style="text-align: center; margin-top: 0;">Create an Account</h1>
        
        <div th:if="${error}" class="error" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
        <div class="link">
            Already have an account? <a th:href="@{/login}">Log in</a>
        </div>
    </div>
</body>
</html>
