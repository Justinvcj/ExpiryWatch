<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
    <div class="container card">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 1rem;">
            <img th:src="@{/images/logo.png}" alt="ExpiryWatch Logo" style="height: 36px; width: auto;">
            <a th:href="@{/documents}" style="text-decoration: none; color: #6366f1; font-weight: 600;">&larr; Back to Dashboard</a>
        </div>
        
        <div class="header">
            <div>
                <h1 th:text="${document.title}">Document Title</h1>
                <div class="meta">
                    Type: <strong th:text="${document.documentType.name}">type</strong> • 
                    Added on: <span th:text="${#temporals.format(document.createdAt, 'yyyy-MM-dd')}">2026-01-01</span>
                </div>
                <span class="badge" th:classappend="'status-' + ${document.status}" th:text="${document.status}">ACTIVE</span>
                <span class="badge" th:text="${document.severity}">MINOR</span>
            </div>
        </div>

        <div class="details">
            <h2>Expiry Information</h2>
            <p style="font-size: 1.2rem;">
                Expires on: <strong th:text="${document.extractedExpiryDate}">2026-12-31</strong>
            </p>
        </div>

        <div th:if="${document.fileData != null}" style="margin-top: 2rem;">
            <h2>Document Image</h2>
            <img th:if="${document.fileContentType.startsWith('image/')}" 
                 th:src="@{/documents/{id}/file(id=${document.id})}" 
                 style="max-width: 100%; height: auto; border: 1px solid #ccc; border-radius: 4px;" alt="Document" />
            <a th:unless="${document.fileContentType.startsWith('image/')}" 
               th:href="@{/documents/{id}/file(id=${document.id})}" target="_blank" class="btn btn-secondary">View Attached File</a>
        </div>

        <div class="actions">
            <form th:if="${document.status == 'active' || document.status == 'expired'}" 
                  th:action="@{/documents/{id}/status(id=${document.id})}" method="post">
                <input type="hidden" name="status" value="renewed">
                <button type="submit" class="btn btn-secondary">Mark Renewed</button>
            </form>

            <form th:if="${document.status != 'archived'}" 
                  th:action="@{/documents/{id}/status(id=${document.id})}" method="post">
                <input type="hidden" name="status" value="archived">
                <button type="submit" class="btn btn-secondary">Archive</button>
            </form>

            <form th:if="${document.status == 'archived'}" 
                  th:action="@{/documents/{id}/status(id=${document.id})}" method="post">
                <input type="hidden" name="status" value="active">
                <button type="submit" class="btn btn-secondary">Unarchive</button>
            </form>
        </div>
    </div>
</body>
</html>
