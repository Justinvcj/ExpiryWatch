<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - ExpiryWatch</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="card" style="width: 100%; max-width: 420px;">
        <div style="text-align: center; margin-bottom: 1rem;">
            <img th:src="@{/images/logo.png}" alt="ExpiryWatch Logo" style="height: 60px; width: auto;">
        </div>
        <h1 style="text-align: center; margin-top: 0;">Login to ExpiryWatch</h1>
        
        <div th:if="${param.error}" class="error">
            Invalid email or password.
        </div>
        <div th:if="${param.logout}" class="message">
            You have been logged out.
        </div>
        <div th:if="${param.registered}" class="message">
            Registration successful! Please log in.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Email</label>
                <input type="email" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Log In</button>
        </form>
        <div class="link">
            Don't have an account? <a th:href="@{/register}">Sign up</a>
        </div>
    </div>
</body>
</html>
